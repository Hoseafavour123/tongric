<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="cargoBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky)" />
  <!-- Road -->
  <rect y="195" width="400" height="55" fill="#334155" />
  <line x1="0" y1="222" x2="400" y2="222" stroke="#f8fafc" stroke-width="4" stroke-dasharray="24 16" />
  <!-- Cargo Container Box -->
  <rect x="50" y="70" width="200" height="105" rx="4" fill="url(#cargoBox)" stroke="#cbd5e1" stroke-width="2" />
  <line x1="90" y1="70" x2="90" y2="175" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="70" x2="150" y2="175" stroke="#cbd5e1" stroke-width="2" />
  <line x1="210" y1="70" x2="210" y2="175" stroke="#cbd5e1" stroke-width="2" />
  <!-- Green Tongric Stripe on Container -->
  <rect x="50" y="115" width="200" height="24" fill="#15803d" />
  <text x="150" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TONGRIC FREIGHT</text>
  <!-- Truck Cab -->
  <path d="M250 100 L290 100 L320 135 L325 175 L250 175 Z" fill="url(#truckBody)" />
  <!-- Windshield -->
  <path d="M285 106 L310 135 L260 135 L260 106 Z" fill="#93c5fd" opacity="0.8" />
  <!-- Headlight -->
  <rect x="318" y="152" width="8" height="12" rx="2" fill="#fde047" />
  <!-- Front Bumper -->
  <rect x="316" y="166" width="12" height="12" rx="2" fill="#475569" />
  <!-- Wheels -->
  <g fill="#0f172a">
    <circle cx="95" cy="188" r="22" />
    <circle cx="195" cy="188" r="22" />
    <circle cx="285" cy="188" r="22" />
  </g>
  <g fill="#94a3b8">
    <circle cx="95" cy="188" r="10" />
    <circle cx="195" cy="188" r="10" />
    <circle cx="285" cy="188" r="10" />
  </g>
</svg>

