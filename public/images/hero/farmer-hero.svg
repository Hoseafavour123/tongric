<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad)" />
  <circle cx="680" cy="120" r="70" fill="url(#sunGrad)" opacity="0.85" />
  
  <!-- Rolling Hills & Farm Ridges -->
  <path d="M0,320 Q200,280 400,310 T800,290 L800,600 L0,600 Z" fill="#166534" opacity="0.7" />
  <path d="M0,370 Q250,330 500,360 T800,340 L800,600 L0,600 Z" fill="url(#fieldGrad)" />
  
  <!-- Produce Ridges Pattern -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#14532d" stroke-width="4" stroke-dasharray="16,8" opacity="0.6" />
  <line x1="0" y1="490" x2="800" y2="490" stroke="#14532d" stroke-width="5" stroke-dasharray="20,10" opacity="0.6" />
  <line x1="0" y1="540" x2="800" y2="540" stroke="#052e16" stroke-width="6" stroke-dasharray="24,12" opacity="0.7" />

  <!-- Farmer Silhouette / Character -->
  <g transform="translate(350, 220)">
    <!-- Hat -->
    <ellipse cx="50" cy="40" rx="45" ry="14" fill="#d97706" />
    <path d="M25,40 C25,15 75,15 75,40 Z" fill="#b45309" />
    <!-- Head -->
    <circle cx="50" cy="50" r="18" fill="#78350f" />
    <!-- Body -->
    <path d="M20,75 L80,75 L90,170 L10,170 Z" fill="#15803d" />
    <!-- Arms holding basket -->
    <path d="M20,80 L-10,120 L25,135" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M80,80 L110,120 L75,135" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Harvest Basket -->
    <polygon points="10,120 90,120 78,165 22,165" fill="#ca8a04" stroke="#854d0e" stroke-width="3" />
    <!-- Harvest Crops (Yams & Peppers in basket) -->
    <circle cx="35" cy="115" r="12" fill="#ef4444" />
    <circle cx="50" cy="112" r="14" fill="#eab308" />
    <ellipse cx="65" cy="114" rx="14" ry="10" fill="#78350f" />
    <!-- Legs -->
    <rect x="25" y="170" width="18" height="90" fill="#1e293b" />
    <rect x="57" y="170" width="18" height="90" fill="#1e293b" />
    <!-- Boots -->
    <path d="M22,250 L45,250 L48,270 L18,270 Z" fill="#0f172a" />
    <path d="M54,250 L77,250 L80,270 L50,270 Z" fill="#0f172a" />
  </g>

  <!-- Clean Overlay Card Badge -->
  <rect x="30" y="30" width="260" height="60" rx="12" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="55" cy="60" r="14" fill="#15803d" />
  <text x="55" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="80" y="52" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Benue Farm-Gate Direct</text>
  <text x="80" y="70" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Verified Smallholder Growers</text>
</svg>

