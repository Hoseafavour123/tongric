    <path d="M50,105 Q100,95 150,100" stroke="#451a03" stroke-width="2.5" fill="none" opacity="0.6" />
  </g>
  <rect x="20" y="235" width="360" height="45" rx="8" fill="#ffffff" fill-opacity="0.9" />
  <text x="200" y="263" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">White Guinea Yam (Tubers)</text>
