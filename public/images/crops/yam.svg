<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#fef3c7" />
  <g transform="translate(100, 70)">
    <!-- Yam Tubers -->
    <ellipse cx="100" cy="80" rx="95" ry="40" fill="#78350f" transform="rotate(-15 100 80)" />
    <ellipse cx="100" cy="80" rx="90" ry="36" fill="#854d0e" transform="rotate(-15 100 80)" />
    <!-- Sliced end showing creamy white flesh -->
    <ellipse cx="180" cy="55" rx="20" ry="35" fill="#fef9c3" stroke="#78350f" stroke-width="4" transform="rotate(-15 180 55)" />
    <!-- Texture ridges -->
